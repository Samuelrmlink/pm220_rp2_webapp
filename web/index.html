<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PM220 editor</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <h1>PM220</h1>
        <button type="button" id="open">Open</button>
        <button type="button" id="save">Save</button>
        <button type="button" id="del">Delete</button>
        <button type="button" id="print" class="primary">Print</button>
        <input id="file" type="file" accept=".json,.pm220.json,application/json" hidden>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/*" hidden>
        <span id="status">connecting…</span>
    </header>
    <div id="picker" hidden>
        <div class="picker-backdrop"></div>
        <div class="picker-panel" role="dialog" aria-labelledby="picker-title">
            <h2 id="picker-title">Open label</h2>
            <p id="picker-err" class="picker-err" hidden></p>
            <ul id="picker-list"></ul>
            <p id="picker-empty" class="picker-empty" hidden>No labels on the Pico yet.</p>
            <div id="picker-save-row" hidden>
                <label for="picker-name">Name</label>
                <input id="picker-name" type="text" spellcheck="false" autocomplete="off">
            </div>
            <div class="picker-actions">
                <button type="button" id="picker-pc">This computer…</button>
                <button type="button" id="picker-save" class="primary">Save</button>
                <button type="button" id="picker-cancel">Cancel</button>
            </div>
        </div>
    </div>
    <main>
        <div class="stage-wrap" id="stage-wrap">
            <div class="stage" id="stage">
                <canvas id="preview" width="384" height="240"></canvas>
                <div class="crop-band" id="crop"></div>
                <div class="safe-rect" id="safe"></div>
            </div>
        </div>
        <aside id="props">
            <h2 id="pane-title">Add object</h2>
            <div id="add-pane">
                <p class="empty">Select an object on the label, or add one:</p>
                <button type="button" id="add-text">Text box</button>
                <button type="button" id="add-image">Image</button>
                <button type="button" id="add-qr">QR code</button>
                <button type="button" id="add-barcode">1D barcode</button>
            </div>
            <div id="warn" hidden>
                <p class="warn warn-overflow" id="warn-overflow" hidden>Box extends outside the printable area.</p>
                <p class="warn warn-clip" id="warn-clip" hidden>Text may overrun this box (auto size and word wrap are off).</p>
                <p class="warn warn-clip" id="warn-payload" hidden></p>
            </div>
            <div id="editor-pane" hidden>
                <form id="form-text" hidden>
                    <label for="text">Text</label>
                    <textarea id="text"></textarea>
                    <label for="font">Font</label>
                    <select id="font">
                        <option value="Arial">Arial</option>
                    </select>
                    <label for="size">Size (dots)</label>
                    <input id="size" type="number" min="4" max="240" step="1">
                    <div class="checks">
                        <label><input type="checkbox" id="autoSize"> Auto size</label>
                        <label><input type="checkbox" id="wrap"> Word wrap</label>
                        <label><input type="checkbox" id="bold"> Bold</label>
                        <label><input type="checkbox" id="italic"> Italic</label>
                        <label><input type="checkbox" id="underline"> Underline</label>
                    </div>
                    <div class="row">
                        <div>
                            <label for="align">Horizontal</label>
                            <select id="align">
                                <option value="left">Left</option>
                                <option value="center">Center</option>
                                <option value="right">Right</option>
                            </select>
                        </div>
                        <div>
                            <label for="valign">Vertical</label>
                            <select id="valign">
                                <option value="top">Top</option>
                                <option value="middle">Middle</option>
                                <option value="bottom">Bottom</option>
                            </select>
                        </div>
                    </div>
                </form>
                <form id="form-qr" hidden>
                    <label for="qr-payload">Contents</label>
                    <textarea id="qr-payload"></textarea>
                    <div class="checks">
                        <label><input type="checkbox" id="qr-pixel"> Pixel-perfect scale</label>
                    </div>
                </form>
                <form id="form-barcode" hidden>
                    <label for="bc-payload">Contents</label>
                    <textarea id="bc-payload"></textarea>
                    <label for="bc-sym">Symbology</label>
                    <select id="bc-sym">
                        <option value="code128">Code 128</option>
                    </select>
                    <div class="checks">
                        <label><input type="checkbox" id="bc-text"> Show text</label>
                    </div>
                    <div class="row">
                        <div>
                            <label for="bc-font">Text size</label>
                            <input id="bc-font" type="number" min="4" max="72" step="1">
                        </div>
                        <div>
                            <label for="bc-off">Offset from bottom</label>
                            <input id="bc-off" type="number" step="1">
                        </div>
                    </div>
                </form>
                <form id="form-image" hidden>
                    <button type="button" id="replace-image">Replace image</button>
                    <div class="checks">
                        <label><input type="checkbox" id="img-dither"> Dither</label>
                    </div>
                </form>
                <form id="form-common">
                    <div id="common-rotate-wrap">
                        <label for="rotate">Rotation</label>
                        <select id="rotate">
                            <option value="0">0°</option>
                            <option value="90">90°</option>
                            <option value="180">180°</option>
                            <option value="270">270°</option>
                        </select>
                    </div>
                    <div class="checks">
                        <label><input type="checkbox" id="advanced"> Advanced</label>
                    </div>
                    <div id="coords" hidden>
                        <div id="advanced-qr" hidden>
                            <label for="qr-ecc">Error correction</label>
                            <select id="qr-ecc">
                                <option value="L">L (7%)</option>
                                <option value="M">M (15%)</option>
                                <option value="Q">Q (25%)</option>
                                <option value="H">H (30%)</option>
                            </select>
                        </div>
                        <div class="coords">
                            <label for="ox">x</label>
                            <label for="oy">y</label>
                            <label for="ow">w</label>
                            <label for="oh">h</label>
                            <input id="ox" type="number" step="1">
                            <input id="oy" type="number" step="1">
                            <input id="ow" type="number" step="1" min="8">
                            <input id="oh" type="number" step="1" min="8">
                        </div>
                    </div>
                </form>
            </div>
        </aside>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
